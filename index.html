<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step Up English</title>
<meta name="theme-color" content="#2C47D6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : une colonne étroite, barre de statut collante ; la séance prend tout l'écran avec une barre d'action fixée en bas. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#141C33; --muted:#59627A; --line:#D8DEE9;
  --accent:#2C47D6; --accent-ink:#FFFFFF; --accent-soft:#E2E7FB;
  --good:#157F53; --good-bg:#DFF2E8; --bad:#C23838; --bad-bg:#FBE4E4; --warn:#A86A00; --warn-bg:#FFF1D6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1322; --surface:#171F35; --ink:#E7EBF5; --muted:#99A2B8; --line:#2A3350;
  --accent:#8196FF; --accent-ink:#0E1322; --accent-soft:#232E55;
  --good:#4CC38A; --good-bg:#15342A; --bad:#F27272; --bad-bg:#3B1C22; --warn:#F2B648; --warn-bg:#3A2D12; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.note{font-size:14px;color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;flex:1}
.brand span{color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:4px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.skills{display:grid;gap:12px}
.sk{display:grid;grid-template-columns:110px 1fr 52px;align-items:center;gap:10px}
.sk .nm{font-weight:700}
.bar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.sk .lv{font-family:var(--f-mono);font-weight:700;text-align:right;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border:0;background:none;width:100%;text-align:left}
.toggle .sw{flex:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .2s}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw::after{left:23px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
details summary{cursor:pointer;font-weight:700}
/* séance */
.stop{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);padding:2px 8px}
.stop .bar{flex:1;height:8px}
.clock{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.stage{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:6px 300px}
.kind{color:var(--muted);font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.skilltag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:6px}
.prompt{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
.prompt.sm{font-size:23px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)}
.audio{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spk{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.spk svg{width:20px;height:20px;fill:var(--accent)}
.spk.big{width:92px;height:92px;border-radius:50%;justify-content:center;padding:0}
.spk.big svg{width:40px;height:40px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;align-self:center}
.mic svg{width:40px;height:40px;fill:currentColor}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.heard{min-height:28px;font-size:18px;text-align:center}
.diff span{padding:1px 3px;border-radius:4px}
.diff .hit{background:var(--good-bg);color:var(--good)}
.diff .miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline}
.timer{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.timer>i{display:block;height:100%;background:var(--warn);width:100%}
.intro .en{font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--accent);line-height:1.1;overflow-wrap:anywhere}
.intro .fr{font-size:20px}
.dlg{display:grid;gap:8px}
.dlg div{padding:8px 12px;border-radius:10px;background:var(--accent-soft);max-width:85%}
.dlg div:nth-child(even){justify-self:end;background:var(--surface);border:1px solid var(--line)}
.answer-line{min-height:56px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
.tok.used{visibility:hidden}
input.type{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.foot.ok{background:var(--good-bg);border-color:var(--good)}
.foot.ko{background:var(--bad-bg);border-color:var(--bad)}
.foot.mid{background:var(--warn-bg);border-color:var(--warn)}
.fb h3{font-size:19px}
.foot.ok h3{color:var(--good)} .foot.ko h3{color:var(--bad)} .foot.mid h3{color:var(--warn)}
.fb p{margin:2px 0 0}
.wd{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted currentColor;cursor:pointer}
.wdout{margin:0;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.tr{font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:6px!important}
.res{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.banner{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="words.js"></script>
<script src="sentences.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
